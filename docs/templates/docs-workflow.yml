# Template: copy to .github/workflows/docs.yml using credentials with workflow permission.
name: Documentation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate project documentation
        run: python3 scripts/check_project.py
