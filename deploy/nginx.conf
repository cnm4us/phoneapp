server {
    listen 80;
    listen [::]:80;
    server_name phoneapp.bawebtech.com;
    location /.well-known/acme-challenge/ { root /var/www/phoneapp-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name phoneapp.bawebtech.com;
    ssl_certificate /etc/letsencrypt/live/phoneapp.bawebtech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phoneapp.bawebtech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1k;
    # No request URI, query strings, authorization headers, or payloads in access logs.
    access_log off;
    error_log /var/log/nginx/phoneapp-error.log warn;

    location = / { proxy_pass http://127.0.0.1:8787; }
    location = /app.js { proxy_pass http://127.0.0.1:8787; }
    location = /styles.css { proxy_pass http://127.0.0.1:8787; }
    location = /health { proxy_pass http://127.0.0.1:8787; }
    location = /rooms { proxy_pass http://127.0.0.1:8787; proxy_read_timeout 15s; }
    location = /signal {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location / { return 404; }
}
